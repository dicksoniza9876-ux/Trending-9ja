name: Auto update site

on:
  schedule:
    - cron: '20 */3 * * *'      # every 3 hours (UTC)
  push:
    paths:
      - 'bot/inbox/*.json'     # instructions sent from the admin page
  workflow_dispatch:
    inputs:
      approve_ids:
        description: 'Draft ids to PUBLISH (comma separated)'
        required: false
        default: ''
      reject_ids:
        description: 'Draft ids to DELETE (comma separated)'
        required: false
        default: ''
      dry_run:
        description: 'Test run: write nothing, publish nothing'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: site-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow (for the headline image cards)
        run: pip install pillow

      - name: Run the bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          APPROVE: ${{ github.event.inputs.approve_ids }}
          REJECT: ${{ github.event.inputs.reject_ids }}
          DRY: ${{ github.event.inputs.dry_run }}
          EVENT: ${{ github.event_name }}
        run: |
          EXTRA=""
          if [ "$DRY" = "true" ]; then EXTRA="--dry-run"; fi
          if [ "$EVENT" = "push" ]; then EXTRA="$EXTRA --jobs-only"; fi
          python bot/update.py --approve "$APPROVE" --reject "$REJECT" $EXTRA

      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Auto update $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash
          git push

      - name: Post new stories to Telegram
        if: ${{ github.event.inputs.dry_run != 'true' }}
        continue-on-error: true      # a Telegram problem never blocks the website
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot/post_telegram.py

      - name: Save the Telegram record
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git add -A
          if git diff --cached --quiet; then echo "Nothing to save."; exit 0; fi
          git commit -m "Telegram record $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash
          git push
