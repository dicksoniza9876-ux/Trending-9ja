<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Trending9ja Studio</title>
<link rel="icon" href="assets/logo.jpg">
<style>
:root{--g:#006640;--g2:#00a86b;--bg:#f4f7f5;--card:#fff;--ink:#14231c;--mute:#5b6b63;--line:#dbe4df;--bad:#b3261e;--you:#dff5e9}
@media (prefers-color-scheme:dark){:root{--bg:#0f1713;--card:#17231d;--ink:#e8f1ec;--mute:#93a69c;--line:#27372f;--you:#1d3a2c}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
#app{height:100dvh;display:flex;flex-direction:column;max-width:760px;margin:0 auto;background:var(--bg)}
header{display:flex;align-items:center;gap:.6rem;padding:.7rem 1rem;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff}
header h1{font-size:1.05rem;margin:0;flex:1}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:.45rem .7rem;font-size:.9rem}
#screen-lock{display:none;padding:1.2rem;overflow:auto}
#screen-chat{display:none;flex:1;min-height:0;flex-direction:column}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem;margin-bottom:1rem}
.panel h2{margin:.1rem 0 .6rem;font-size:1.05rem}
label{display:block;font-size:.85rem;color:var(--mute);margin:.7rem 0 .25rem}
input[type=text],input[type=password],textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:.7rem;font-size:1rem;background:var(--card);color:var(--ink);font-family:inherit}
.btn{border:0;border-radius:10px;padding:.75rem 1rem;font-size:1rem;font-weight:600;background:var(--g);color:#fff}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:var(--bad)}
.btn[disabled]{opacity:.5}
.note{font-size:.82rem;color:var(--mute);line-height:1.45}
.err{color:var(--bad);font-size:.9rem;margin-top:.6rem;min-height:1.2em}
#msgs{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.7rem}
.bubble{max-width:88%;padding:.7rem .9rem;border-radius:14px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;border:1px solid var(--line);background:var(--card)}
.bubble.you{align-self:flex-end;background:var(--you);border-color:transparent}
.bubble.sys{align-self:center;font-size:.85rem;color:var(--mute);background:transparent;border:0;text-align:center}
.bubble img.th{width:70px;height:70px;object-fit:cover;border-radius:8px;margin:.3rem .3rem 0 0}
.action{align-self:stretch;max-width:100%;border:2px solid var(--g2);background:var(--card);border-radius:14px;padding:.9rem}
.action.danger{border-color:var(--bad)}
.action h3{margin:0 0 .5rem;font-size:1rem}
.action ul{margin:.2rem 0 .7rem;padding-left:1.1rem;font-size:.92rem;line-height:1.5}
.action .row{display:flex;gap:.6rem}
.action .row .btn{flex:1}
.chips{display:flex;gap:.5rem;overflow-x:auto;padding:.5rem 1rem;scrollbar-width:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.45rem .85rem;font-size:.88rem}
#pending{display:flex;gap:.5rem;padding:0 1rem;flex-wrap:wrap}
.pt{position:relative}.pt img{width:58px;height:58px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.pt b{position:absolute;left:3px;top:3px;background:var(--g);color:#fff;border-radius:6px;font-size:.7rem;padding:0 .35rem}
.pt button{position:absolute;right:-6px;top:-6px;width:20px;height:20px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:.7rem;line-height:1;padding:0}
#composer{display:flex;gap:.5rem;padding:.6rem 1rem calc(.8rem + env(safe-area-inset-bottom));align-items:flex-end}
#composer textarea{resize:none;max-height:9rem;min-height:2.9rem}
#composer .btn{padding:.7rem .9rem}
a{color:var(--g2)}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Trending9ja Studio</h1>
    <button id="btn-settings" style="display:none">Settings</button>
    <button id="btn-lock" style="display:none">Lock</button>
  </header>

  <section id="screen-lock"></section>

  <section id="screen-chat">
    <div id="msgs"></div>
    <div class="chips" id="chips"></div>
    <div id="pending"></div>
    <div id="composer">
      <button class="btn alt" id="btn-attach" title="Add pictures">📷</button>
      <textarea id="input" rows="1" placeholder="Tell me what to do on the site..."></textarea>
      <button class="btn" id="btn-send">Send</button>
      <input type="file" id="file" accept="image/*" multiple hidden>
    </div>
  </section>
</div>

<script>
/* ============================================================
   Trending9ja Studio - private admin page
   - Your keys are stored ONLY in this browser, encrypted with your passcode.
   - Nothing happens on the site until you press "Do it".
   - Changes are sent to the bot as small "job" files in GitHub.
   ============================================================ */
const SETTINGS = {
  owner: 'trending9jaupdates',
  repo: 'Trending-9ja',
  branch: 'main',
  workflowFile: 'auto-update.yml',
  vaultKey: 'n9studio.vault',
  autoLockMinutes: 15
};

const CATEGORIES = ['Politics', 'Business', 'Entertainment', 'Football', 'Music', 'Movies', 'Health', 'Tech/AI'];
const REGIONS = ['Nigeria', 'USA', 'Europe', 'World'];

const Core = (() => {
  const enc = new TextEncoder(), dec = new TextDecoder();
  const b64 = {
    enc(bytes) {
      const a = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
      let s = '';
      for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000));
      return btoa(s);
    },
    dec(str) { return Uint8Array.from(atob(str), c => c.charCodeAt(0)); },
    encText(t) { return b64.enc(enc.encode(t)); }
  };

  /* ---------- encrypted vault (passcode -> keys) ---------- */
  async function deriveKey(pass, salt) {
    const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' }, base,
      { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  async function sealVault(secrets, pass) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await deriveKey(pass, salt);
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(secrets)));
    return JSON.stringify({ v: 1, salt: b64.enc(salt), iv: b64.enc(iv), data: b64.enc(new Uint8Array(ct)) });
  }
  async function openVault(text, pass) {
    const o = JSON.parse(text);
    const key = await deriveKey(pass, b64.dec(o.salt));
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64.dec(o.iv) }, key, b64.dec(o.data));
    return JSON.parse(dec.decode(pt));
  }

  /* ---------- GitHub ---------- */
  function ghClient(token, owner, repo, branch) {
    const base = `https://api.github.com/repos/${owner}/${repo}`;
    async function call(method, path, body) {
      const r = await fetch(base + path, {
        method,
        headers: Object.assign({ Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json',
          'X-GitHub-Api-Version': '2022-11-28' }, body ? { 'Content-Type': 'application/json' } : {}),
        body: body ? JSON.stringify(body) : undefined
      });
      const text = await r.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch (e) { /* not json */ }
      if (!r.ok) {
        const e = new Error((data && data.message) || ('HTTP ' + r.status));
        e.status = r.status;
        throw e;
      }
      return data;
    }
    const enc2 = p => p.split('/').map(encodeURIComponent).join('/');
    return {
      call,
      repoInfo: () => call('GET', ''),
      putFile: (path, contentB64, message) =>
        call('PUT', '/contents/' + enc2(path), { message, content: contentB64, branch }),
      async getText(path) {
        const d = await call('GET', '/contents/' + enc2(path) + '?ref=' + encodeURIComponent(branch));
        return dec.decode(b64.dec(String(d.content || '').replace(/\n/g, '')));
      },
      async runForCommit(sha) {
        const d = await call('GET', '/actions/runs?head_sha=' + sha + '&per_page=5');
        return (d.workflow_runs || [])[0] || null;
      },
      dispatch: wf => call('POST', '/actions/workflows/' + wf + '/dispatches', { ref: branch }),
      async latestRuns(n) { return (await call('GET', '/actions/runs?per_page=' + n)).workflow_runs || []; }
    };
  }

  /* ---------- site knowledge ---------- */
  function parseArchive(htmlText) {
    const out = [];
    const re = /<article class="post-card" data-date="([^"]+)">\s*<a class="card-link" href="news\/([^"]+)\.html" aria-label="([^"]*)"[\s\S]*?class="category-tag">([^<]*)/g;
    let m;
    const un = s => s.replace(/&amp;/g, '&').replace(/&quot;/g, '"').replace(/&#x27;|&#39;/g, "'").replace(/&lt;/g, '<').replace(/&gt;/g, '>');
    while ((m = re.exec(htmlText))) out.push({ date: m[1], id: m[2], title: un(m[3]), category: m[4] });
    return out;
  }
  function readStory(htmlText) {
    const un = s => s.replace(/<[^>]+>/g, '').replace(/&amp;/g, '&').replace(/&quot;/g, '"').replace(/&#x27;|&#39;/g, "'");
    const t = (htmlText.match(/<h1>([\s\S]*?)<\/h1>/) || [])[1] || '';
    const body = (htmlText.match(/<p class="meta">[\s\S]*?<\/p>([\s\S]*?)<div class="ad-slot" data-slot="article">/) || [])[1] || '';
    const paras = (body.match(/<p>[\s\S]*?<\/p>/g) || []).map(un);
    const credit = (body.match(/<p class="credit">([^<]*)<\/p>/) || [])[1] || '';
    return { title: un(t), paragraphs: paras, credit };
  }

  /* ---------- AI (Gemini) ---------- */
  function systemPrompt(stories, attachments) {
    const list = stories.slice(0, 70).map(s => `${s.id} | ${s.title} | ${s.category} | ${s.date}`).join('\n');
    const att = attachments.length
      ? attachments.map((a, i) => `${i + 1} (${a.name})`).join(', ') : 'none';
    return `You are the assistant inside the private admin page of Trending9ja, a Nigerian news blog run by one owner.
Turn the owner's message into ONE action, or just reply. Answer with JSON only: {"reply": "short friendly text", "action": null or {...}}.

Today is ${new Date().toISOString().slice(0, 10)}.
Categories: ${CATEGORIES.join(', ')}. Politics stories also have a region: ${REGIONS.join(', ')}.
Pictures the owner has attached (numbered): ${att}

ACTIONS (use exactly these shapes):
- Publish a new post: {"type":"post","title":"","category":"","region":null,"body":"paragraphs separated by a blank line","summary":"one sentence","source_name":"","source_url":"","credit":"","rewrite":false,"image":null}
  "image" is the number of an attached picture, or null for an automatic headline card. "credit" is the photo credit text such as "Photo: Reuters", or "" for none.
  Use the owner's own text as the body. Set "rewrite" true ONLY if the owner asks you to rewrite or polish it. Never invent facts.
- Change a story's picture: {"type":"image","id":"","image":1,"credit":""}  (image null = use the green headline card; credit null = leave the credit as it is, "" = remove it)
- Fix wording in a story: {"type":"edit","id":"","replace":[{"old":"exact existing text","new":"replacement"}]}
- Remove a story: {"type":"delete","id":""}
- Run the bot now to fetch fresh news: {"type":"run"}
- Read a story before editing it: {"type":"read","id":""}  (you then receive its text; use this whenever you need the exact words for an edit)

RULES
- "id" must be copied from this list of recent stories. If you are not sure which story is meant, ask in "reply" and set "action" to null.
- Do not make up pictures: only use numbers of pictures that are attached.
- Keep "reply" to one or two short sentences. Nothing is done until the owner presses a button, so describe what you propose.

RECENT STORIES (id | title | category | date)
${list}`;
  }
  function parseModelJson(text) {
    const clean = String(text || '').trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
    const o = JSON.parse(clean);
    return { reply: String(o.reply || ''), action: o.action && typeof o.action === 'object' ? o.action : null };
  }
  async function listModels(key) {
    const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200', { headers: { 'x-goog-api-key': key } });
    if (!r.ok) throw new Error('Gemini says: HTTP ' + r.status);
    const d = await r.json();
    const bad = ['image', 'tts', 'live', 'audio', 'embedding', 'robotics', 'computer', 'native', 'learnlm', 'gemma', 'veo', 'imagen'];
    const flash = (d.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
      .map(m => m.name.split('/').pop()).filter(n => n.includes('flash') && !bad.some(b => n.includes(b)));
    const ver = n => parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/) || [0, 0])[1]);
    flash.sort((a, b) => (a.includes('lite') - b.includes('lite')) || (ver(b) - ver(a)) || a.localeCompare(b));
    return flash;
  }
  async function gemini(key, models, system, contents) {
    let lastErr = 'no model available';
    for (const model of models.slice(0, 4)) {
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
        body: JSON.stringify({ systemInstruction: { parts: [{ text: system }] }, contents,
          generationConfig: { temperature: 0.2, responseMimeType: 'application/json' } })
      });
      if (r.ok) {
        const d = await r.json();
        const text = (((d.candidates || [])[0] || {}).content || {}).parts;
        return parseModelJson(text && text[0] ? text[0].text : '');
      }
      lastErr = `${model}: HTTP ${r.status}`;
      if (![404, 429, 503].includes(r.status)) break;
    }
    throw new Error('Gemini failed - ' + lastErr);
  }

  /* ---------- actions ---------- */
  function checkAction(a, stories, nAttach) {
    if (!a || typeof a !== 'object') return { ok: false, error: 'No action.' };
    const ids = new Set(stories.map(s => s.id));
    const needImg = v => v !== null && v !== undefined && v !== '';
    const imgOk = v => !needImg(v) || (Number.isInteger(v) && v >= 1 && v <= nAttach);
    switch (a.type) {
      case 'post':
        if (!CATEGORIES.includes(a.category)) return { ok: false, error: 'Pick a category: ' + CATEGORIES.join(', ') };
        if (!a.title || String(a.title).length < 8) return { ok: false, error: 'The post needs a title.' };
        if (!a.body || String(a.body).length < 40) return { ok: false, error: 'The post needs more text.' };
        if (!imgOk(a.image)) return { ok: false, error: 'That picture number is not attached.' };
        return { ok: true };
      case 'image':
        if (!ids.has(a.id)) return { ok: false, error: 'I could not match that story.' };
        if (!imgOk(a.image)) return { ok: false, error: 'That picture number is not attached.' };
        return { ok: true };
      case 'edit':
        if (!ids.has(a.id)) return { ok: false, error: 'I could not match that story.' };
        if (!Array.isArray(a.replace) || !a.replace.length || a.replace.some(r => !r || !r.old)) return { ok: false, error: 'Nothing to change.' };
        return { ok: true };
      case 'delete':
        return ids.has(a.id) ? { ok: true } : { ok: false, error: 'I could not match that story.' };
      case 'run':
        return { ok: true };
      default:
        return { ok: false, error: 'Unknown action.' };
    }
  }
  function describeAction(a, stories) {
    const t = id => (stories.find(s => s.id === id) || {}).title || id;
    const L = [];
    if (a.type === 'post') {
      L.push(`Title: ${a.title}`, `Category: ${a.category}${a.category === 'Politics' ? ' / ' + (a.region || 'Nigeria') : ''}`);
      L.push(`Text: ${String(a.body).slice(0, 140)}${String(a.body).length > 140 ? '...' : ''}`);
      L.push(a.image ? `Picture: your attached picture ${a.image}${a.credit ? ' (' + a.credit + ')' : ''}` : 'Picture: green headline card');
      if (a.source_name) L.push(`Source: ${a.source_name}`);
      if (a.rewrite) L.push('The bot will tidy the wording first.');
    } else if (a.type === 'image') {
      L.push(`Story: ${t(a.id)}`);
      L.push(a.image ? `New picture: your attached picture ${a.image}` : 'New picture: green headline card');
      if (a.credit === '') L.push('Photo credit will be removed.');
      else if (a.credit) L.push(`Photo credit: ${a.credit}`);
    } else if (a.type === 'edit') {
      L.push(`Story: ${t(a.id)}`);
      a.replace.forEach(r => L.push(`"${r.old}" -> "${r.new}"`));
    } else if (a.type === 'delete') {
      L.push(`Story: ${t(a.id)}`, 'The page, its picture and its cards are removed from the site.');
    } else if (a.type === 'run') {
      L.push('Start the news bot now (it fetches and publishes fresh stories).');
    }
    return L;
  }
  function buildJob(a, files) {
    const pick = (o, keys) => keys.reduce((r, k) => (o[k] !== undefined && o[k] !== null ? (r[k] = o[k], r) : r), {});
    let job;
    if (a.type === 'post') job = Object.assign({ type: 'post' }, pick(a, ['title', 'category', 'region', 'body', 'summary', 'source_name', 'source_url', 'credit', 'rewrite']));
    else if (a.type === 'image') job = Object.assign({ type: 'image' }, pick(a, ['id', 'credit']));
    else if (a.type === 'edit') job = { type: 'edit', id: a.id, replace: a.replace.map(r => ({ old: String(r.old), new: String(r.new == null ? '' : r.new) })) };
    else if (a.type === 'delete') job = { type: 'delete', id: a.id };
    else throw new Error('Cannot build a job for ' + a.type);
    if ((a.type === 'post' || a.type === 'image') && files.image) {
      job.image = 'pic';
      job.files = { pic: files.image };
    }
    return job;
  }
  return { b64, sealVault, openVault, ghClient, parseArchive, readStory, systemPrompt, parseModelJson,
    listModels, gemini, checkAction, describeAction, buildJob };
})();

/* ============================================================
   Screen code (only runs in a browser)
   ============================================================ */
function startUI() {
  const $ = id => document.getElementById(id);
  const S = { secrets: null, gh: null, models: null, stories: [], history: [], attachments: [], busy: false, lockTimer: null };

  function el(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => { if (k === 'class') e.className = v; else if (k.startsWith('on')) e[k] = v; else e.setAttribute(k, v); });
    kids.forEach(k => e.append(k && k.nodeType ? k : document.createTextNode(k == null ? '' : String(k))));
    return e;
  }

  /* ----- lock screen ----- */
  function show(which) {
    $('screen-lock').style.display = which === 'lock' ? 'block' : 'none';
    $('screen-chat').style.display = which === 'chat' ? 'flex' : 'none';
    $('btn-lock').style.display = which === 'chat' ? '' : 'none';
    $('btn-settings').style.display = which === 'chat' ? '' : 'none';
  }
  function lockScreen() {
    const has = !!localStorage.getItem(SETTINGS.vaultKey);
    const box = $('screen-lock');
    box.textContent = '';
    const err = el('div', { class: 'err' });
    if (has) {
      const pass = el('input', { type: 'password', placeholder: 'Your passcode', autocomplete: 'current-password' });
      const go = async () => {
        err.textContent = '';
        try {
          S.secrets = await Core.openVault(localStorage.getItem(SETTINGS.vaultKey), pass.value);
          enter();
        } catch (e) { err.textContent = 'Wrong passcode.'; }
      };
      pass.onkeydown = e => { if (e.key === 'Enter') go(); };
      box.append(el('div', { class: 'panel' }, el('h2', {}, 'Unlock Studio'),
        el('label', {}, 'Passcode'), pass, err,
        el('div', { style: 'margin-top:1rem' }, el('button', { class: 'btn', onclick: go }, 'Unlock')),
        el('p', { class: 'note' }, 'Forgot it? Use "Forget keys" below and set the page up again.'),
        el('button', { class: 'btn alt', onclick: () => { if (confirm('Remove the saved keys from this device?')) { localStorage.removeItem(SETTINGS.vaultKey); lockScreen(); } } }, 'Forget keys on this device')));
      show('lock');
      setTimeout(() => pass.focus(), 50);
    } else {
      const tok = el('input', { type: 'password', placeholder: 'github_pat_...', autocomplete: 'off' });
      const gem = el('input', { type: 'password', placeholder: 'AIza...', autocomplete: 'off' });
      const p1 = el('input', { type: 'password', placeholder: 'At least 8 characters', autocomplete: 'new-password' });
      const p2 = el('input', { type: 'password', placeholder: 'Repeat the passcode', autocomplete: 'new-password' });
      const save = async () => {
        err.textContent = '';
        if (tok.value.trim().length < 20) return err.textContent = 'Paste your GitHub token.';
        if (gem.value.trim().length < 20) return err.textContent = 'Paste your Gemini key.';
        if (p1.value.length < 8) return err.textContent = 'Passcode must be at least 8 characters.';
        if (p1.value !== p2.value) return err.textContent = 'The two passcodes do not match.';
        try {
          S.secrets = { github: tok.value.trim(), gemini: gem.value.trim() };
          await Core.ghClient(S.secrets.github, SETTINGS.owner, SETTINGS.repo, SETTINGS.branch).repoInfo();
          localStorage.setItem(SETTINGS.vaultKey, await Core.sealVault(S.secrets, p1.value));
          enter();
        } catch (e) { err.textContent = 'GitHub did not accept that token: ' + e.message; }
      };
      box.append(el('div', { class: 'panel' }, el('h2', {}, 'Set up Studio (once)'),
        el('p', { class: 'note' }, 'Your keys are encrypted with your passcode and stay on this device only. They are never sent anywhere except to GitHub and Google.'),
        el('label', {}, 'GitHub token'), tok,
        el('label', {}, 'Gemini API key'), gem,
        el('label', {}, 'Choose a passcode'), p1,
        el('label', {}, 'Repeat passcode'), p2, err,
        el('div', { style: 'margin-top:1rem' }, el('button', { class: 'btn', onclick: save }, 'Save and open'))));
      show('lock');
    }
  }
  function lock() {
    S.secrets = null; S.gh = null; S.history = []; S.attachments = [];
    clearTimeout(S.lockTimer);
    $('msgs').textContent = ''; $('pending').textContent = '';
    lockScreen();
  }
  function touch() {
    clearTimeout(S.lockTimer);
    if (S.secrets) S.lockTimer = setTimeout(lock, SETTINGS.autoLockMinutes * 60000);
  }

  /* ----- chat helpers ----- */
  function bubble(text, cls, thumbs) {
    const b = el('div', { class: 'bubble ' + (cls || '') }, text);
    (thumbs || []).forEach(u => b.append(el('img', { class: 'th', src: u, alt: '' })));
    $('msgs').append(b);
    $('msgs').scrollTop = $('msgs').scrollHeight;
    return b;
  }
  function renderPending() {
    const box = $('pending');
    box.textContent = '';
    S.attachments.forEach((a, i) => box.append(el('div', { class: 'pt' }, el('img', { src: a.url, alt: '' }), el('b', {}, String(i + 1)),
      el('button', { onclick: () => { S.attachments.splice(i, 1); renderPending(); } }, 'x'))));
  }
  async function resizeImage(file) {
    const url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 1200, sc = Math.min(1, max / img.width);
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.86));
    const buf = new Uint8Array(await blob.arrayBuffer());
    return { name: file.name, b64: Core.b64.enc(buf), url: c.toDataURL('image/jpeg', 0.4) };
  }

  async function loadStories() {
    try {
      const r = await fetch('archive.html?_=' + Date.now());
      S.stories = Core.parseArchive(await r.text());
    } catch (e) { S.stories = []; }
  }

  /* ----- talking to the AI ----- */
  async function ask(userText) {
    if (!S.models) S.models = await Core.listModels(S.secrets.gemini);
    const note = S.attachments.length ? `\n[Attached pictures: ${S.attachments.map((a, i) => i + 1).join(', ')}]` : '';
    S.history.push({ role: 'user', parts: [{ text: userText + note }] });
    let result = null;
    for (let hop = 0; hop < 3; hop++) {
      result = await Core.gemini(S.secrets.gemini, S.models, Core.systemPrompt(S.stories, S.attachments), S.history.slice(-12));
      S.history.push({ role: 'model', parts: [{ text: JSON.stringify(result) }] });
      if (result.action && result.action.type === 'read') {
        const id = result.action.id;
        let info;
        try {
          const r = await fetch('news/' + encodeURIComponent(id) + '.html?_=' + Date.now());
          if (!r.ok) throw new Error('HTTP ' + r.status);
          const st = Core.readStory(await r.text());
          info = `STORY ${id}\nTitle: ${st.title}\nCredit: ${st.credit}\n` + st.paragraphs.join('\n\n');
        } catch (e) { info = `Could not read story ${id}: ${e.message}`; }
        S.history.push({ role: 'user', parts: [{ text: info }] });
        continue;
      }
      break;
    }
    return result;
  }

  async function send(text) {
    if (S.busy || !text.trim()) return;
    S.busy = true; touch();
    $('btn-send').disabled = true;
    bubble(text, 'you', S.attachments.map(a => a.url));
    try {
      if (!S.stories.length) await loadStories();
      const res = await ask(text);
      if (res.reply) bubble(res.reply, '');
      const a = res.action;
      if (a && a.type !== 'read') {
        const chk = Core.checkAction(a, S.stories, S.attachments.length);
        if (!chk.ok) bubble(chk.error, 'sys');
        else proposeAction(a);
      }
    } catch (e) {
      bubble('Something went wrong: ' + e.message, 'sys');
    }
    S.busy = false; $('btn-send').disabled = false;
  }

  function proposeAction(a) {
    const danger = a.type === 'delete';
    const lines = Core.describeAction(a, S.stories);
    const card = el('div', { class: 'action' + (danger ? ' danger' : '') },
      el('h3', {}, { post: 'Publish this post?', image: 'Change this picture?', edit: 'Make this change?', delete: 'Remove this story?', run: 'Run the bot now?' }[a.type]),
      el('ul', {}, ...lines.map(l => el('li', {}, l))));
    const yes = el('button', { class: 'btn' + (danger ? ' bad' : '') }, danger ? 'Yes, remove it' : 'Do it');
    const no = el('button', { class: 'btn alt' }, 'Cancel');
    const row = el('div', { class: 'row' }, yes, no);
    card.append(row);
    no.onclick = () => { card.remove(); bubble('Cancelled.', 'sys'); };
    yes.onclick = async () => {
      row.remove();
      card.append(el('div', { class: 'note' }, 'Sending...'));
      await execute(a, card);
    };
    $('msgs').append(card);
    $('msgs').scrollTop = $('msgs').scrollHeight;
  }

  /* ----- doing it ----- */
  async function execute(a, card) {
    const status = el('div', { class: 'note' }, '');
    card.lastChild.replaceWith(status);
    const say = t => { status.textContent = t; $('msgs').scrollTop = $('msgs').scrollHeight; };
    try {
      if (!S.gh) S.gh = Core.ghClient(S.secrets.github, SETTINGS.owner, SETTINGS.repo, SETTINGS.branch);
      if (a.type === 'run') {
        await S.gh.dispatch(SETTINGS.workflowFile);
        say('Started. Open the Actions tab on GitHub to watch it. New stories appear in a few minutes.');
        return;
      }
      const jobId = Date.now().toString(36);
      const files = {};
      if ((a.type === 'post' || a.type === 'image') && a.image) {
        const att = S.attachments[a.image - 1];
        const path = `bot/inbox/files/${jobId}-pic.jpg`;
        say('Uploading the picture...');
        await S.gh.putFile(path, att.b64, 'admin: upload picture');
        files.image = path;
      }
      const job = Core.buildJob(a, files);
      say('Sending the instruction to the bot...');
      const name = `${jobId}-${a.type}.json`;
      const res = await S.gh.putFile('bot/inbox/' + name, Core.b64.encText(JSON.stringify(job, null, 1)), 'admin: ' + a.type);
      const sha = res.commit.sha;
      if (files.image) { S.attachments = []; renderPending(); }
      await watch(sha, name, say);
    } catch (e) {
      say('Failed: ' + e.message + (e.status === 403 || e.status === 404 ? ' (check the token permissions)' : ''));
    }
  }

  async function watch(sha, jobName, say) {
    say('Queued. The bot starts in a few seconds...');
    const t0 = Date.now();
    let run = null;
    while (Date.now() - t0 < 10 * 60000) {
      await new Promise(r => setTimeout(r, 6000));
      touch();
      try { run = await S.gh.runForCommit(sha); } catch (e) { run = null; }
      if (!run) continue;
      if (run.status === 'completed') break;
      say(run.status === 'queued' ? 'Waiting for the bot to start...' : 'The bot is working on it...');
    }
    if (!run || run.status !== 'completed') return say('Still running. Check the Actions tab on GitHub in a minute.');
    if (run.conclusion === 'cancelled') return say('A newer bot run took over your request. Check the Actions tab in a minute - your change will be applied by it.');
    if (run.conclusion !== 'success') return say('The bot run failed. Open the Actions tab on GitHub to see why: ' + run.html_url);
    let msg = 'Done.';
    try {
      const log = JSON.parse(await S.gh.getText('bot/inbox_log.json'));
      const mine = log.reverse().find(x => x.job === jobName);
      if (mine) msg = (mine.ok ? 'Done: ' : 'The bot could not do it: ') + mine.message.replace(/`/g, '');
      const id = mine && (mine.message.match(/`([^`]+)`/) || [])[1];
      if (mine && mine.ok && id && !/Removed/.test(mine.message)) msg += '\nIt goes live on the site in 1 to 2 minutes: ' + location.origin + '/news/' + id + '.html';
    } catch (e) { /* log not readable - fine */ }
    say(msg);
    loadStories();
  }

  /* ----- start ----- */
  async function enter() {
    show('chat');
    S.gh = Core.ghClient(S.secrets.github, SETTINGS.owner, SETTINGS.repo, SETTINGS.branch);
    $('msgs').textContent = '';
    bubble('Hello! Tell me what to do on the site. I will always show you the plan and wait for your OK first.', '');
    await loadStories();
    touch();
  }

  const chips = [
    ['New post', 'I want to publish a new post. '],
    ['Change a picture', 'Change the picture of the story about '],
    ['Fix wording', 'Fix the wording in the story about '],
    ['Remove a story', 'Remove the story about '],
    ['Run the bot', 'Run the bot now to fetch fresh news.'],
    ['Recent runs', null]
  ];
  chips.forEach(([label, text]) => $('chips').append(el('button', { class: 'chip', onclick: async () => {
    touch();
    if (text === null) {
      try {
        const runs = await S.gh.latestRuns(5);
        bubble(runs.map(r => `${r.status === 'completed' ? (r.conclusion === 'success' ? 'OK' : 'X') : '...'}  ${r.name}  ${new Date(r.created_at).toLocaleString()}`).join('\n') || 'No runs yet.', 'sys');
      } catch (e) { bubble('Could not read the runs: ' + e.message, 'sys'); }
    } else { $('input').value = text; $('input').focus(); if (label === 'Run the bot') $('btn-send').click(); }
  } }, label)));

  $('btn-send').onclick = () => { const t = $('input').value; $('input').value = ''; autosize(); send(t); };
  $('input').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 700) { e.preventDefault(); $('btn-send').click(); } };
  const autosize = () => { const i = $('input'); i.style.height = 'auto'; i.style.height = Math.min(i.scrollHeight, 144) + 'px'; };
  $('input').oninput = autosize;
  $('btn-attach').onclick = () => $('file').click();
  $('file').onchange = async e => {
    for (const f of e.target.files) {
      try { S.attachments.push(await resizeImage(f)); } catch (err) { bubble('Could not read ' + f.name, 'sys'); }
    }
    e.target.value = '';
    renderPending(); touch();
  };
  $('btn-lock').onclick = lock;
  $('btn-settings').onclick = () => {
    bubble('Settings: your keys are saved on this device only, encrypted with your passcode. The page locks itself after ' + SETTINGS.autoLockMinutes + ' minutes. To use a new token or key, lock the page, tap "Forget keys on this device", and set it up again.', 'sys');
  };
  ['click', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, touch, { passive: true }));
  lockScreen();
}

if (typeof document !== 'undefined' && document.getElementById('app')) startUI();
</script>
</body>
