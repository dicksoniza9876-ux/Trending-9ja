name: Deploy site zip

# Runs whenever a .zip is uploaded to the "incoming" folder.
on:
  push:
    paths:
      - 'incoming/*.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-write
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Find the uploaded zip
        id: find
        run: |
          COUNT=$( (ls incoming/*.zip 2>/dev/null || true) | wc -l )
          if [ "$COUNT" -eq 0 ]; then echo "No zip found in incoming/"; exit 1; fi
          if [ "$COUNT" -gt 1 ]; then echo "More than one zip in incoming/. Upload one at a time."; exit 1; fi
          echo "zip=$(ls incoming/*.zip)" >> "$GITHUB_OUTPUT"

      - name: Unpack and run safety checks
        run: |
          rm -rf /tmp/site && mkdir /tmp/site
          unzip -q "${{ steps.find.outputs.zip }}" -d /tmp/site
          rm -rf /tmp/site/__MACOSX

          # If the zip holds one top-level folder, use that folder as the site root
          ROOT=/tmp/site
          if [ "$(ls -A /tmp/site | wc -l)" = "1" ] && [ -d "/tmp/site/$(ls -A /tmp/site)" ]; then
            ROOT="/tmp/site/$(ls -A /tmp/site)"
          fi
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

          [ -f "$ROOT/index.html" ] || { echo "Stopping: index.html is missing from the zip."; exit 1; }
          [ -d "$ROOT/news" ] || { echo "Stopping: the news folder is missing from the zip."; exit 1; }

          NEW=$(find "$ROOT/news" -maxdepth 1 -name '*.html' | wc -l)
          OLD=$( (ls news/*.html 2>/dev/null || true) | wc -l )
          echo "Stories in zip: $NEW | Stories on live site: $OLD"
          if [ "$NEW" -lt "$OLD" ]; then
            echo "Stopping: the zip has fewer stories than the live site (looks like an old zip)."
            exit 1
          fi

      - name: Copy the new files into the site
        run: |
          rsync -a --exclude='.git' --exclude='.github' --exclude='incoming' --exclude='bot/state.json' --exclude='bot/drafts' --exclude='bot/gist.txt' "$ROOT"/ ./
          rm -f "${{ steps.find.outputs.zip }}"

      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          {
            echo "### New stories added"
            git diff --cached --name-only --diff-filter=A -- 'news/*.html' | sed 's#news/##; s#\.html##; s#^#- #'
          } >> "$GITHUB_STEP_SUMMARY"
          git commit -m "Update site from zip"
          git push
